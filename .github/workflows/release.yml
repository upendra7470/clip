name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux clipboard dependencies
        run: sudo apt-get update && sudo apt-get install -y xclip xvfb

      - name: Run tests
        run: xvfb-run -a go test ./...

      - name: Build release binaries
        run: |
          set -eu
          # Strip the leading "v" so --version prints "clip 1.1.0", not "clip vv1.1.0"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          build() {
            local goos="$1" goarch="$2"
            local name="clip_${VERSION}_${goos}_${goarch}"
            local out="dist/${name}"
            [ "$goos" = "windows" ] && out="${out}.exe"

            echo "Building ${name}..."
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$out" ./cmd/clip
          }

          build linux   amd64
          build linux   arm64
          build darwin  amd64
          build darwin  arm64
          build windows amd64

          # Package each binary into a tarball/zip for easy download,
          # removing the raw binary as soon as it is archived
          cd dist
          for f in clip_*; do
            case "$f" in
              *.exe)
                zip -q "${f%.exe}.zip" "$f"
                ;;
              *)
                tar -czf "${f}.tar.gz" "$f"
                ;;
            esac
            rm "$f"
          done
          shasum -a 256 * > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
