name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  security:
    name: Security gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Clip
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Reject reachable vulnerabilities
        run: $(go env GOPATH)/bin/govulncheck ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-musl
            extension: ""
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-musl
            extension: ""
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
            extension: ""
          - runner: macos-15-intel
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
            extension: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
            extension: .exe
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Clip
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout pinned OCR engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: robertknight/ocrs
          ref: 548732120c391e9e48560aa73b670815a9064678 # ocrs-v0.14.0
          path: .release/ocrs

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.rust_target }}

      - name: Install static Linux toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build native OCR engine
        if: runner.os != 'Linux'
        shell: bash
        run: cargo build --locked --release -p ocrs-cli --features onnx --target ${{ matrix.rust_target }} --manifest-path .release/ocrs/Cargo.toml

      - name: Build static Linux OCR engine
        if: runner.os == 'Linux'
        shell: bash
        env:
          CC: musl-gcc
        run: cargo build --locked --release -p ocrs-cli --features onnx --target ${{ matrix.rust_target }} --manifest-path .release/ocrs/Cargo.toml

      - name: Bundle OCR engine and verified models
        shell: bash
        env:
          ENGINE_EXTENSION: ${{ matrix.extension }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          assets=internal/ocrbundle/assets
          mkdir -p "$assets"
          rm -f "$assets/placeholder.txt"
          cp ".release/ocrs/target/${RUST_TARGET}/release/ocrs${ENGINE_EXTENSION}" "$assets/clip-ocr${ENGINE_EXTENSION}"
          cp .release/ocrs/LICENSE-MIT.txt "$assets/OCRS-LICENSE-MIT.txt"
          cp .release/ocrs/LICENSE-APACHE.txt "$assets/OCRS-LICENSE-APACHE.txt"
          curl --fail --location --retry 3 --output "$assets/text-detection.onnx" https://ocrs-models.s3-accelerate.amazonaws.com/text-detection.onnx
          curl --fail --location --retry 3 --output "$assets/text-recognition.onnx" https://ocrs-models.s3-accelerate.amazonaws.com/text-recognition.onnx
          actual_detection=$(openssl dgst -sha256 "$assets/text-detection.onnx" | awk '{print $NF}')
          actual_recognition=$(openssl dgst -sha256 "$assets/text-recognition.onnx" | awk '{print $NF}')
          test "$actual_detection" = "a917b23dbd9524b465df7e922641b3ff2981623df4ded5a0234004ef2fee7cfe"
          test "$actual_recognition" = "86c145c2edb96c8caed5b1ebb8f44d706408922211451c309c625157dd6061c5"

      - name: Build self-contained Clip binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "dist/clip_${GOOS}_${GOARCH}${EXTENSION}" ./cmd/clip

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clip-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/clip_*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum clip_* > checksums.txt

      - name: Attest release provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/*
