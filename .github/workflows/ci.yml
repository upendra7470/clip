name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Smoke test checksum-verifying installer (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export CLIP_INSTALL_DIR="$RUNNER_TEMP/clip-install"
          ./install.sh
          "$CLIP_INSTALL_DIR/clip" --version

      - name: Smoke test checksum-verifying installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLIP_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "clip-install"
          & .\install.ps1
          & (Join-Path $env:CLIP_INSTALL_DIR "clip.exe") --version

      - name: Install virtual display for clipboard test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests (Linux, with virtual display for clipboard)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test -v ./...

      - name: Run tests
        if: runner.os != 'Linux'
        run: go test -v ./...
