name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Install Linux clipboard dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xclip xvfb

      - name: Run tests (Linux, with virtual display for clipboard)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test -v ./...

      - name: Run tests
        if: runner.os != 'Linux'
        run: go test -v ./...
